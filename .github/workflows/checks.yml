name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vp test run
      - run: pnpm exec vp run package
      - uses: actions/setup-go@v7.0.0
        if: runner.os != 'Windows'
        with:
          go-version: "1.27.3"
          cache: false
      - run: pnpm exec vp run test:runtime
        if: runner.os != 'Windows'
      - name: Install the published plugin through the client
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        env:
          YOI_GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec vp run test:runtime
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: yoi-${{ runner.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
